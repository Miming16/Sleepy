<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepy - Advanced Sleep Cycle Planner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
    <style>
        :root {
            /* Common variables */
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
            --radius-main: 24px;
            --radius-btn: 12px;
            
            /* Dark Mode (Default) */
            --bg-page: #030712;
            --bg-accent: linear-gradient(135deg, #4f46e5 0%, #a855f7 100%);
            --card-base: rgba(30, 41, 59, 0.5);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --result-best: #34d399;
            --result-ok: #a855f7;
            --icon-sun: opacity(0);
            --icon-moon: opacity(1);
        }

        [data-theme="light"] {
            /* Light Mode */
            --bg-page: #f1f5f9;
            --bg-accent: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            --card-base: rgba(255, 255, 255, 0.6);
            --card-border: rgba(0, 0, 0, 0.05);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --input-bg: #ffffff;
            --result-best: #10b981;
            --result-ok: #8b5cf6;
            --icon-sun: opacity(1);
            --icon-moon: opacity(0);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }

        body {
            background-color: var(--bg-page);
            background-image: radial-gradient(at 10% 10%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                              radial-gradient(at 90% 90%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: background-color 0.4s var(--ease), color 0.4s var(--ease);
        }

        /* --- Theme Toggle Style --- */
        .theme-toggle-container {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
        }

        .theme-toggle-btn {
            background: var(--card-base);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s var(--ease);
        }

        .theme-toggle-btn:hover { transform: scale(1.1); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }

        .theme-icon {
            width: 20px;
            height: 20px;
            transition: opacity 0.3s var(--ease);
        }

        .theme-icon.sun { filter: var(--icon-sun); position: absolute; }
        .theme-icon.moon { filter: var(--icon-moon); }

        /* --- Main Card --- */
        .card {
            background: var(--card-base);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-main);
            backdrop-filter: blur(20px);
            padding: 3rem 2rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: var(--bg-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; font-weight: 500; }

        /* --- Mode Switcher --- */
        .mode-switcher {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: var(--input-bg);
            border-radius: var(--radius-btn);
            padding: 5px;
            margin-bottom: 2rem;
            border: 1px solid var(--card-border);
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 5px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s var(--ease);
        }

        .mode-btn.active {
            background: var(--bg-accent);
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* --- Input Section --- */
        .input-wrapper { display: flex; flex-direction: column; gap: 8px; margin-bottom: 2rem; text-align: left; }
        label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        input[type="time"] {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 14px;
            border-radius: var(--radius-btn);
            font-size: 1.2rem;
            font-weight: 600;
            outline: none;
            width: 100%;
            transition: all 0.3s var(--ease);
        }
        input[type="time"]:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15); }

        .btn-calc {
            width: 100%;
            background: var(--bg-accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: var(--radius-btn);
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
            transition: all 0.3s var(--ease);
        }
        .btn-calc:hover { transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.3); }

        /* --- Results Section --- */
        .results-title {
            text-align: left;
            margin: 2rem 0 1rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            display: none; /* Hidden until calc */
        }

        .results { display: flex; flex-direction: column; gap: 12px; }

        .result-item {
            background: var(--card-base);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.3s var(--ease);
        }
        .result-item:hover { transform: scale(1.02); }

        .result-item.best { border-color: var(--result-best); }
        .result-item.ok { border-color: var(--result-ok); }

        .result-time-block { text-align: left; }
        .result-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
        .result-time { font-size: 1.5rem; font-weight: 800; color: var(--text-main); line-height: 1.2; }

        .result-meta { text-align: right; }
        .result-cycles { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
        .result-hrs { font-size: 0.8rem; color: var(--text-muted); }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 3px 7px;
            border-radius: 6px;
            font-weight: 700;
            margin-left: 5px;
            vertical-align: middle;
        }
        .result-item.best .badge { background: var(--result-best); color: #ffffff; }
        .result-item.ok .badge { background: var(--result-ok); color: #ffffff; }
    </style>
</head>
<body>

<!-- Theme Toggle Button -->
<div class="theme-toggle-container">
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" aria-label="Toggle Light/Dark Mode">
        <svg class="theme-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="theme-icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
</div>

<div class="card">
    <h1>Sleepy</h1>
    <p class="subtitle">Optimal sleep requires 90-minute cycles</p>

    <div class="mode-switcher">
        <button class="mode-btn active" id="btn-now" onclick="setCalcMode('now')">Sleep Now</button>
        <button class="mode-btn" id="btn-wake" onclick="setCalcMode('wake')">Target Wake</button>
        <button class="mode-btn" id="btn-sleep" onclick="setCalcMode('sleep')">Target Bed</button>
    </div>

    <div class="input-wrapper" id="time-input-section" style="display: none;">
        <label id="input-label" for="user-time">I want to wake up at:</label>
        <input type="time" id="user-time" value="07:00">
    </div>

    <button class="btn-calc" onclick="calculate()">Calculate Optimal Times</button>

    <div class="results-title" id="results-head">Recommended Times</div>
    <div class="results" id="results"></div>
</div>

<script>
    const LATENCY = 14; // Average mins to fall asleep
    let currentCalcMode = 'now';

    // --- Theme Logic ---
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('sleepy-theme', theme);
    }

    // Detect system preference and stored preference
    const storedTheme = localStorage.getItem('sleepy-theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');

    if (storedTheme) {
        applyTheme(storedTheme);
    } else {
        applyTheme(systemPrefersDark.matches ? 'dark' : 'light');
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    }

    // --- Calculation Logic ---
    function setCalcMode(mode) {
        currentCalcMode = mode;
        const btns = ['btn-now', 'btn-wake', 'btn-sleep'];
        btns.forEach(id => document.getElementById(id).classList.toggle('active', id === `btn-${mode}`));

        const inputSection = document.getElementById('time-input-section');
        const label = document.getElementById('input-label');
        const calculateBtn = document.querySelector('.btn-calc');

        // Reset results display
        document.getElementById('results-head').style.display = 'none';
        document.getElementById('results').innerHTML = '';

        if (mode === 'now') {
            inputSection.style.display = 'none';
            label.textContent = "";
            calculateBtn.textContent = 'Calculate Wake Times';
        } else if (mode === 'wake') {
            inputSection.style.display = 'flex';
            label.textContent = "I need to wake up at:";
            calculateBtn.textContent = 'Calculate Bedtimes';
        } else {
            inputSection.style.display = 'flex';
            label.textContent = "I'm going to bed at:";
            calculateBtn.textContent = 'Calculate Wake Times';
        }
    }

    function calculate() {
        const container = document.getElementById('results');
        container.innerHTML = '';
        document.getElementById('results-head').style.display = 'block';

        let targetTime = new Date();

        if (currentCalcMode !== 'now') {
            const timeVal = document.getElementById('user-time').value;
            if (!timeVal) return;
            const [hrs, mins] = timeVal.split(':').map(Number);
            targetTime.setHours(hrs, mins, 0, 0);
        }

        // Cycle configurations [cycles, label]
        const options = [
            [6, "Excellent (9 hrs)"],
            [5, "Optimal (7.5 hrs)"],
            [4, "Okay (6 hrs)"],
            [3, "Short (4.5 hrs)"]
        ];

        options.forEach(([cycles, durationLabel]) => {
            let calcTime = new Date(targetTime.getTime());
            const totalMins = (cycles * 90) + LATENCY;

            if (currentCalcMode === 'wake') {
                calcTime.setMinutes(calcTime.getMinutes() - totalMins);
            } else {
                calcTime.setMinutes(calcTime.getMinutes() + totalMins);
            }

            const isBedtimeCalc = currentCalcMode === 'wake';
            const timeLabel = isBedtimeCalc ? 'Aim to sleep at:' : 'Set your alarm for:';
            const formattedTime = calcTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const qualityClass = cycles >= 5 ? 'best' : (cycles === 4 ? 'ok' : '');
            const badge = cycles >= 5 ? '<span class="badge">Recommended</span>' : (cycles === 4 ? '<span class="badge">Functional</span>' : '');

            const resultHTML = `
                <div class="result-item ${qualityClass}">
                    <div class="result-time-block">
                        <div class="result-label">${timeLabel} ${badge}</div>
                        <div class="result-time">${formattedTime}</div>
                    </div>
                    <div class="result-meta">
                        <div class="result-cycles">${cycles} Cycles</div>
                        <div class="result-hrs">${durationLabel}</div>
                    </div>
                </div>
            `;
            container.innerHTML += resultHTML;
        });
    }

    calculate();
</script>
</body>
</html>
